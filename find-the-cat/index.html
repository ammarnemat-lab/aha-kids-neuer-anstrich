    $('#intro').classList.remove('on'); state = 'play'; startT = performance.now(); hintBtn.style.visibility = 'visible';
    if (isPhone && document.documentElement.requestFullscreen && !document.fullscreenElement && !/iPhone|iPad/.test(navigator.userAgent)) document.documentElement.requestFullscreen().catch(() => { });
  }
  $('#go').addEventListener('click', start);
  $('#again').addEventListener('click', () => newRound(false));
  hintBtn.addEventListener('click', giveHint);

  /* ---------- main loop ---------- */
  let lastT = performance.now(), lastTimer = -1;
  function loop(now) {
    frame++; const dt = Math.min(50, now - lastT); lastT = now;
    stepFly(now);
    if (!gesture && !fly && (Math.abs(vel.x) > .01 || Math.abs(vel.y) > .01)) { view.x -= vel.x * dt / view.z; view.y -= vel.y * dt / view.z; clampView(); const k = Math.pow(.93, dt / 16); vel.x *= k; vel.y *= k; }
    const need = drawWorld();
    drawLife(now); drawFx(now); drawMinimap();
    renderSome(need, gesture || fly ? 7 : 14);
    if (state === 'play') { const s = Math.floor((now - startT) / 1000); if (s !== lastTimer) { lastTimer = s; timerEl.textContent = fmt(now - startT); } }
    requestAnimationFrame(loop);
  }
  resize(); sizeMinimap();
  centerOn(W * .5, H * .62, isPhone ? .55 : .8);
  requestAnimationFrame(loop);
  const bar = $('#bar i'), goBtn = $('#go');
  startWorkers(() => buildThumb(p => { bar.style.width = Math.round(p * 100) + '%'; }).then(() => {
    thumbReady = true; $('#bar').style.opacity = 0; goBtn.disabled = false; goBtn.textContent = 'Start';
    if (/qa/.test(location.hash)) { $('#intro').classList.remove('on'); state = 'play'; startT = performance.now(); }
  }));
  newRound(true);

  /* ---------- test hooks (used for screenshots) ---------- */
  window.__jungle = {
    view, SPOTS, OBJ, ANIMALS,
    set(x, y, z) { fly = null; centerOn(x, y, z); },
    spot(id) { setSpot(id); },
    pending() { const tw = P / pickRes(); let n = 0; for (let ty = Math.floor(view.y / tw); ty <= Math.floor((view.y + VH / view.z - .01) / tw); ty++) for (let tx = Math.floor(view.x / tw); tx <= Math.floor((view.x + VW / view.z - .01) / tw); tx++) if (!cache.has(pickRes() + ':' + tx + ':' + ty)) n++; return thumbReady ? n : 999; },
    async ready() { for (let i = 0; i < 400; i++) { if (this.pending() === 0) return true; await new Promise(r => setTimeout(r, 50)); } return false; },
    workers: () => useWorkers ? workers.length : 0,
    world(scale, x0 = 0, y0 = 0, w = W, h = H) { const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale); const g = c.getContext('2d'); g.setTransform(scale, 0, 0, scale, -x0 * scale, -y0 * scale); const t0 = performance.now(); paint(g, x0, y0, x0 + w, y0 + h); console.log('world render ms', Math.round(performance.now() - t0), 'objects', OBJ.length); return c.toDataURL('image/jpeg', .88); },
    tap(wx, wy) { onTap((wx - view.x) * view.z, (wy - view.y) * view.z); },
    hint: giveHint, start,
  };
})();

</script>
</body>
